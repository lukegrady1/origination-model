[project]
name = "nfl-origination"
version = "0.1.0"
description = "Reproducible NFL pregame price origination research pipeline (V1)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "requests>=2.32",
    "matplotlib>=3.9",
    "streamlit>=1.38",
]

[project.scripts]
nfl-origination = "nfl_origination.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-requests",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_origination"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012", "B008", "SIM108", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# presentation strings in the read-only dashboard
"src/nfl_origination/dashboard/app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/nfl_origination"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["nfl_origination.dashboard.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
