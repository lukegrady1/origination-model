name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-quality-gates:
    runs-on: ubuntu-latest
    env:
      NFL_ORIGINATION_BLOCK_NETWORK: "1"  # tests must never reach the network
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"
      - name: Install from committed lockfile
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy (package code)
        run: uv run mypy src/nfl_origination
      - name: pytest (offline, network blocked)
        run: uv run pytest -q
      - name: Offline demo (synthetic fixtures)
        run: uv run nfl-origination demo --config configs/demo.yaml --offline
      - name: Upload demo report
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: artifacts/demo/runs/*/report
          if-no-files-found: error
