# V1 base configuration (spec section 20). Fit/forecast runs need model.selected_alpha resolved
# from the development decision record; it is never guessed.
schema_version: 1
seed: 42
run:
  kind: forecast
  label: v1
data:
  seasons: [2010, 2025]
  game_type: REG
  mode: historical_reconstruction
  completed_game_lag_hours: 48
forecast:
  cutoff_hours_before_kickoff: 24
features:
  history_games: 16
  half_life_games: 8
  offseason_weight: 0.5
  prior_seasons: 2
  shrinkage_plays: 200
  shrinkage_split_plays: 100
  shrinkage_games: 4
model:
  family: ridge_score
  alpha_candidates: [1, 10, 100, 1000]
  selected_alpha: 100  # development decision record: artifacts/runs/development-20260916T173324Z-b71c52
  ablation_selected_alpha: 100
  train_start_season: 2012
  residual_first_season: 2016
  residual_window_seasons: 5
  min_residual_games: 500
  covariance_diagonal_shrinkage: 0.1
distribution:
  initial_max_score: 100
  score_step: 25
  hard_max_score: 250
  max_omitted_mass: 1.0e-8
evaluation:
  development_seasons: [2018, 2019, 2020, 2021, 2022, 2023]
  confirmation_season: 2024
  holdout_season: 2025
  bootstrap_replicates: 1000
market:
  enabled: false
  bookmaker: null
  max_quote_age_minutes: 60
  min_ev: 0.03
  stake_units: 1
  max_selections_per_game: 1
  moneyline_settlement_rule: two_way_tie_void
